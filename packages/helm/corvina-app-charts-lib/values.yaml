# Reference only: Helm does not merge the values of a library chart into the app chart. The templates read these
# values from the app chart, usually from ../base.yaml.gotmpl and, for the app-specific knobs, from the app chart
# values.yaml, where the values marked (tpl) may contain templates (helmfile would render them in base.yaml.gotmpl).

# images overrides the default images of templates/_images.tpl (k8sWaitFor, rabbitmq, registration) by repository and
# tag. Leave it unset so that a library release bumps the images
# images:
#   k8sWaitFor:
#     # e.g. another mirror; the tag stays the library default
#     repository: docker.io/groundnuty/k8s-wait-for

# appName is the short app name used by the gateway, certificate and issuer names.
# Defaults to the chart name without "corvina-app-"
# appName: ota

# service:
#   # serviceName is the backend Service, also the VirtualService destination
#   serviceName: service-service
#   # healthPath is the path of the backend readiness and liveness probes
#   healthPath: /v1/health
#   # probeInitialDelaySeconds delays the backend probes
#   probeInitialDelaySeconds: 30
#   # pgEnv: false drops the PG_* variables from the backend ConfigMap
#   pgEnv: true
#   # postgresHost (tpl) is PG_HOST and the service the migrator waits for
#   postgresHost: '{{ .Release.Name }}-postgresql'
#   # postgresPasswordEnv is the env var with the postgresql password
#   postgresPasswordEnv: PG_PASS
#   # config (tpl) adds variables to the backend ConfigMap, overriding the defaults
#   config:
#     MANIFEST_BRAND: '{{ .Values.service.envVar.BRAND }}'
#   # automountServiceAccountToken: true mounts the ServiceAccount token in the backend container, for backends
#   # calling the Kubernetes API (by default only the init container waiting for the migrator mounts it)
#   automountServiceAccountToken: false
#   # extraVolumes and extraVolumeMounts (tpl) add volumes to the backend pod and mount them
#   extraVolumes:
#     - name: scratch
#       emptyDir: {}
#   extraVolumeMounts:
#     - name: scratch
#       mountPath: /tmp
#   # extraEnv (tpl) adds env vars to the backend container
#   extraEnv:
#     - name: FOO
#       value: bar

# migrator:
#   # backoffLimit is the number of retries of the migrator Job
#   backoffLimit: 100
#   # extraEnv (tpl) adds env vars to the migrator container
#   extraEnv: []
#   # postgresService (tpl) is the postgresql service to wait for, by default service.postgresHost
#   postgresService: '{{ .Release.Name }}-postgresql-hl'
#   # waitFor (tpl) adds init containers waiting for a service, or with other k8s-wait-for args
#   waitFor:
#     - name: redis-wait
#       service: '{{ .Release.Name }}-redis-headless'
#     - name: harbor-wait
#       args: [pod-we, -lapp=harbor]

