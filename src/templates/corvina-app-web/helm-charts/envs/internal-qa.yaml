appHost: [| .Name |].corvina.cloud
corvinaAppHost: app.corvina.cloud
clusterDomain: cluster.local
gcpNetworkingProject: corvina-internal-qa
# client TLS parameters in the ingress access logs
tlsClientLogging: true
# control plane, called by k8s-wait-for and peer discovery: same as kubeApiServerCidr in corvina-k8s/charts/envs
kubeApiServerCidr: 192.168.0.64/28
# VerticalPodAutoscaler objects (recommend only): the cluster has the VPA CRD
deployVpaObjects: true
# no CPU limits, memory request = limit (corvina-k8s standard): size the containers in values.internal-qa.yaml
resourceShape: true
