fakeExternalSecrets:
  password: password

istio-gateway:
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 10m

imagePullPolicy: IfNotPresent   # necessary for scripts/replace-images.minikube.sh

postgresql:
  global:
    storageClass: csi-hostpath-sc
  primary:
    resources:
      requests:
        cpu: 10m
  metrics:
    resources:
      limits:
        cpu: 150m
        memory: 192Mi
      requests:
        cpu: 100m
        memory: 128Mi

[| if .RedisEnabled -|]
redis:
  global:
    storageClass: csi-hostpath-sc
    defaultStorageClass: csi-hostpath-sc
  master:
    resources:
      requests:
        cpu: 10m
[|- end |]

[| if .RabbitEnabled -|]
rabbitmq:
  storageClass: csi-hostpath-sc
  fakeAuth: true
  resources:
    requests:
      cpu: 10m
[|- end |]

app:
  resources:
    requests:
      cpu: 10m

service:
  extraCa:
    secret: corvina-app-[| .Name |]-prod-tls
  resources:
    requests:
      cpu: 10m

[| if .StasherEnabled -|]
stasher:
  image:
    pullPolicy: IfNotPresent
  extraCa:
    secret: corvina-app-[| .Name |]-prod-tls
  resources:
    requests:
      cpu: 10m
[|- end |]

registration:
  enabled: true

backup:
  enabled: false

cors:
  additionalOrigins: []

networkPolicy:
  # the Corvina hosts (auth, app...) resolve to the haproxy ingress (corvina-k8s minikube-patch-corefile.sh)
  corvinaIngress:
    namespace: prod
    podLabels:
      app.kubernetes.io/name: haproxy-ingress
      app.kubernetes.io/instance: corvina-prod-http
    ports: [443]
