name: Publish

# Registered as trusted publisher on npmjs.com: keep the filename.
# Release tag: `1.2.3` (or `v1.2.3`); `1.2.3-beta.1`, marked as pre-release, goes to `beta`.
# Tags of the packages/npm libraries have their own workflow.
on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    # `corvina-app-charts-lib-X.Y.Z` and `nestjs-app-common-lib-vX.Y.Z` releases have their own workflows
    if: ${{ !startsWith(github.event.release.tag_name, 'corvina-app-charts-lib-') && !startsWith(github.event.release.tag_name, 'nestjs-app-common-lib-') }}
    uses: Corvina-R-D/corvina-github-public-actions/.github/workflows/publish-npm.yaml@v5.4
    with:
      default-branch: master
      go-version-file: go.mod
      test-script: ""
