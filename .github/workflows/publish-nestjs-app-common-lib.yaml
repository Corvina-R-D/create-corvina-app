name: Publish nestjs-app-common-lib

# Registered as trusted publisher of @corvina/nestjs-app-common-lib on npmjs.com: keep the filename.
# Release tag: `nestjs-app-common-lib-v1.2.3`; `nestjs-app-common-lib-v1.2.3-beta.1`, marked as pre-release, goes to `beta`.
on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'nestjs-app-common-lib-')
    uses: Corvina-R-D/corvina-github-public-actions/.github/workflows/npm-publish.yaml@v5.2
    with:
      default-branch: master
      working-directory: packages/npm/nestjs-app-common-lib
      tag-prefix: nestjs-app-common-lib-

  # The template's package.json holds template directives (not valid JSON), so it can't go in
  # `version-files`: only its dependency range on the lib is rewritten, with sed.
  bump-template:
    name: Bump the lib in the app template
    needs: publish
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      TEMPLATE_MANIFEST: src/templates/corvina-app-web/service/package.json
      DEP_RE: '("@corvina/nestjs-app-common-lib"[[:space:]]*:[[:space:]]*"[~^]?)([^"]*)"'
    steps:
      # Same rules as the publish workflow: prereleases are left out.
      - name: Resolve version from release tag
        id: version
        run: |
          VERSION="${RELEASE_TAG#nestjs-app-common-lib-}"
          VERSION="${VERSION#v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "::notice::${VERSION} is a prerelease, leaving the template as is"
            exit 0
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "needed=true" >> "${GITHUB_OUTPUT}"

      - name: Checkout default branch
        if: steps.version.outputs.needed == 'true'
        uses: actions/checkout@v7
        with:
          ref: master

      # Only moves forward.
      - name: Set version in the template
        id: bump
        if: steps.version.outputs.needed == 'true'
        run: |
          CURRENT="$(sed -nE "s#.*${DEP_RE}.*#\2#p" "${TEMPLATE_MANIFEST}")"
          if [ -z "${CURRENT}" ]; then
            echo "::error::No @corvina/nestjs-app-common-lib dependency in ${TEMPLATE_MANIFEST}"
            exit 1
          fi
          if [ "$(printf '%s\n' "${CURRENT}" "${VERSION}" | sort -V | tail -n1)" != "${VERSION}" ] || [ "${CURRENT}" = "${VERSION}" ]; then
            echo "::notice::The template is already at ${CURRENT}, not moving it to ${VERSION}"
            exit 0
          fi
          sed -i -E "s#${DEP_RE}#\1${VERSION}\"#" "${TEMPLATE_MANIFEST}"
          echo "needed=true" >> "${GITHUB_OUTPUT}"

      # Org rulesets require a PR and an `ECC-` branch prefix.
      - name: Commit version bump
        if: steps.bump.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUMP_BRANCH="ECC-template-bump-nestjs-app-common-lib-${VERSION}"
          gh pr list --state open --head "${BUMP_BRANCH}" --json number --jq '.[0].number' \
            | xargs -r -I{} gh pr close {} --delete-branch
          git push origin --delete "${BUMP_BRANCH}" 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BUMP_BRANCH}"
          git add "${TEMPLATE_MANIFEST}"
          git commit -m "chore: bump @corvina/nestjs-app-common-lib to ${VERSION} in the app template"
          git push origin "${BUMP_BRANCH}"
          echo "BUMP_BRANCH=${BUMP_BRANCH}" >> "${GITHUB_ENV}"

      # Doesn't fail where approvals are required: the PR is left for a maintainer to merge.
      - name: Open and merge version bump PR
        if: steps.bump.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="chore: bump @corvina/nestjs-app-common-lib to ${VERSION} in the app template"
          if ! PR_URL="$(gh pr create \
            --base master \
            --head "${BUMP_BRANCH}" \
            --title "${TITLE}" \
            --body "Automated template bump after publishing release ${RELEASE_TAG}.")"; then
            COMPARE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/master...${BUMP_BRANCH}?expand=1"
            echo "::warning::Could not open the template bump PR, open it from ${COMPARE_URL}"
            echo "Template bump to open and merge: [${BUMP_BRANCH}](${COMPARE_URL})" >> "${GITHUB_STEP_SUMMARY}"
          elif ! gh pr merge "${PR_URL}" --squash --delete-branch \
            --subject "${TITLE} [skip ci]"; then
            echo "::warning::Could not merge the template bump PR, it needs approval: ${PR_URL}"
            echo "Template bump PR to approve and merge: ${PR_URL}" >> "${GITHUB_STEP_SUMMARY}"
          fi
